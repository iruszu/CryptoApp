# @format

name: CI

# Run on pushes to main branch, pull requests, and manual triggers
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  test:
    name: Run Tests
    runs-on: macos-14 # Uses macOS 14 (Sonoma) - will try to use latest Xcode

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2' # Try Xcode 16.2, fallback to latest
        continue-on-error: true
      
      - name: List available Xcode versions
        run: |
          ls -la /Applications/ | grep -i xcode || echo "No Xcode found in /Applications"
          xcodebuild -version || echo "xcodebuild failed"
      
      - name: Select Xcode (fallback)
        if: failure()
        run: |
          # Try to find any Xcode 16
          for xcode in /Applications/Xcode*.app; do
            if [ -d "$xcode" ]; then
              echo "Found: $xcode"
              sudo xcode-select -s "$xcode/Contents/Developer"
              xcodebuild -version
              break
            fi
          done

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show Swift version
        run: swift --version

      - name: List available simulators
        run: xcrun simctl list devices available | head -20

      - name: Run tests
        run: |
          xcodebuild test \
            -project Coins.xcodeproj \
            -scheme Coins \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -enableCodeCoverage YES \
            -quiet

      - name: Check test results
        if: always()
        run: |
          echo "Tests completed. Check the output above for results."

